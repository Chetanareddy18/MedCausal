[theme]
base               = "dark"
primaryColor       = "#00d4ff"
backgroundColor    = "#0e1117"
secondaryBackgroundColor = "#161b26"
textColor          = "#e6e9ef"
font               = "sans serif"

[server]
headless           = true
enableCORS         = false
enableXsrfProtection = true

[browser]
gatherUsageStats   = false
